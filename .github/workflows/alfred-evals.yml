name: Alfred conversation evals

# Plays the conversations in evals/cases through Alfred with the real model,
# on in-memory books, and checks what got saved. Runs on changes to how Alfred
# understands people, every night, and on demand. Skips cleanly when the
# DEEPSEEK_API_KEY secret isn't set.
on:
  pull_request:
    paths:
      - "lib/ai/**"
      - "lib/conversation/**"
      - "lib/bank/reply.ts"
      - "lib/bank/ingest.ts"
      - "lib/bank/parse.ts"
      - "lib/finance/**"
      - "lib/studio/**"
      - "lib/evals/**"
      - "evals/**"
      - "scripts/evals.ts"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Times to play each case
        default: "1"

permissions:
  contents: read

concurrency:
  group: alfred-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Real-model conversation evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      EVAL_RUNS: ${{ github.event.inputs.runs || (github.event_name == 'schedule' && '3') || '1' }}
      EVAL_MIN_PASS: "0.85"
      # The runner only builds settings; it never connects to a database.
      SUPABASE_URL: https://jcenaxceqynywmottkxu.supabase.co
      SUPABASE_DB_PASSWORD: synthetic-only
      APP_TIMEZONE: Africa/Accra
      DEFAULT_CURRENCY: GHS
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Play the conversations
        run: npm run evals
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: ignore
