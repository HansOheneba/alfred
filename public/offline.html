<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Alfred is offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: #0b0b0c radial-gradient(70% 42% at 50% -12%, rgba(217, 180, 90, 0.12), transparent 70%);
        color: #ededed; font-family: "Instrument Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif; text-align: center;
      }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 320px; color: #9b9ba1; font-size: 15px; line-height: 1.6; }
      button {
        margin-top: 24px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px;
        background: #d9b45a; color: #1a1404; font: inherit; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/alfred.png" alt="" />
      <h1>You're offline</h1>
      <p>Alfred needs a connection to fetch your books. Your records are safe; try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
