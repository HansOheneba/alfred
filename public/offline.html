<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Alfred could not connect</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: #0b0b0c radial-gradient(70% 42% at 50% -12%, rgba(217, 180, 90, 0.12), transparent 70%);
        color: #ededed; font-family: "Instrument Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif; text-align: center;
      }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 320px; color: #9b9ba1; font-size: 15px; line-height: 1.6; }
      button {
        box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        margin-top: 24px; min-width: 44px; min-height: 44px; padding: 8px 16px;
        border: 1px solid #137d70; border-radius: 12px; background: #137d70; color: #fff;
        font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer;
        transition: background-color 150ms, border-color 150ms;
      }
      button:hover:not(:disabled) { background: #0c665b; border-color: #0c665b; }
      button:focus-visible { outline: 2px solid #5cc4b2; outline-offset: 4px; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/alfred.png" alt="" />
      <h1>Alfred couldn’t connect</h1>
      <p>Your connection may be offline or slow. Your records are safe; try again when you're ready.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
